<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production AI Architect Bootcamp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow-y: auto;
            border-right: 1px solid #333;
            flex-shrink: 0;
            padding: 20px 0;
        }

        .sidebar-title {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #0d47a1;
            border-bottom: 2px solid #0d47a1;
            margin-bottom: 10px;
        }

        .topic {
            margin-bottom: 5px;
        }

        .topic-toggle {
            padding: 12px 20px;
            cursor: pointer;
            background: #252525;
            border: none;
            width: 100%;
            text-align: left;
            color: #e0e0e0;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
        }

        .topic-toggle:hover {
            background: #333;
            border-left-color: #0d47a1;
        }

        .topic-toggle.active {
            background: #0d47a1;
            color: white;
            border-left-color: #0d47a1;
        }

        .topic-toggle::after {
            content: '▼';
            font-size: 10px;
            transition: transform 0.2s;
        }

        .topic-toggle.collapsed::after {
            transform: rotate(-90deg);
        }

        .chapters {
            display: none;
            background: #1a1a1a;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .chapters.active {
            display: block;
            max-height: 2000px;
        }

        .chapter-link {
            padding: 10px 20px 10px 40px;
            cursor: pointer;
            color: #b0b0b0;
            font-size: 13px;
            border-left: 3px solid transparent;
            transition: all 0.2s;
            display: block;
            text-decoration: none;
            background: #1a1a1a;
        }

        .chapter-link:hover {
            background: #252525;
            color: #e0e0e0;
            border-left-color: #0d47a1;
        }

        .chapter-link.active {
            background: #0d47a1;
            color: white;
            border-left-color: #0d47a1;
            font-weight: 600;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .editor-header {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-header h1 {
            font-size: 24px;
            color: #333;
            margin: 0;
        }

        .editor-header .breadcrumb {
            font-size: 12px;
            color: #999;
        }

        .editor-body {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        /* MARKDOWN STYLING */
        .editor-body h1 {
            color: #0d47a1;
            font-size: 32px;
            margin: 30px 0 20px 0;
            border-bottom: 3px solid #0d47a1;
            padding-bottom: 10px;
        }

        .editor-body h2 {
            color: #1976d2;
            font-size: 24px;
            margin: 25px 0 15px 0;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .editor-body h3 {
            color: #333;
            font-size: 18px;
            margin: 20px 0 10px 0;
        }

        .editor-body p {
            line-height: 1.7;
            color: #555;
            margin: 0 0 15px 0;
        }

        .editor-body ul, .editor-body ol {
            margin-left: 30px;
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .editor-body li {
            color: #555;
            margin-bottom: 8px;
        }

        .editor-body code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #d63384;
            font-size: 13px;
        }

        .editor-body pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .editor-body pre code {
            color: #d4d4d4;
            background: none;
            padding: 0;
        }

        .editor-body blockquote {
            border-left: 4px solid #0d47a1;
            padding-left: 15px;
            margin: 15px 0;
            color: #666;
            font-style: italic;
        }

        .editor-body a {
            color: #0d47a1;
            text-decoration: none;
            border-bottom: 1px solid #0d47a1;
        }

        .editor-body a:hover {
            background: #f5f5f5;
        }

        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .welcome h2 {
            border: none;
            color: #0d47a1;
            font-size: 28px;
            margin-bottom: 15px;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
            .editor-body {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-title">📚 Bootcamp Guide</div>
            <div id="sidebar-content"></div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="editor-header">
                <div>
                    <h1 id="page-title">Welcome</h1>
                    <div class="breadcrumb" id="breadcrumb"></div>
                </div>
            </div>
            <div class="editor-body" id="content-area">
                <div class="welcome">
                    <h2>Production AI Architect Bootcamp</h2>
                    <p>👈 Select a topic from the sidebar to get started</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Complete chapter structure
        const chapters = [
            {
                topic: '🚀 Getting Started',
                chapters: [
                    { name: 'Start Here', file: 'getting-started/00-START-HERE.md' },
                    { name: 'Overview', file: 'getting-started/00-README.md' },
                    { name: 'Bootcamp Status', file: 'getting-started/00-BOOTCAMP-COMPLETE-STATUS.md' },
                    { name: 'Optional Sections', file: 'getting-started/00-OPTIONAL-SECTION-GUIDE.md' }
                ]
            },
            {
                topic: '✍️ Prompt Engineering',
                chapters: [
                    { name: 'Fundamentals', file: 'prompt-engineering/01-PROMPT-ENGINEERING-101.md' },
                    { name: 'Exercises', file: 'prompt-engineering/01-PROMPT-ENGINEERING-EXERCISES.md' },
                    { name: 'Raw SDK Example', file: 'prompt-engineering/01-PROMPT-ENGINEERING-example-01-raw-sdk.py' },
                    { name: 'LangChain Example', file: 'prompt-engineering/01-PROMPT-ENGINEERING-example-02-langchain.py' },
                    { name: 'LangGraph Example', file: 'prompt-engineering/01-PROMPT-ENGINEERING-example-03-langgraph.py' },
                    { name: 'AutoGen Example', file: 'prompt-engineering/01-PROMPT-ENGINEERING-example-04-autogen.py' },
                    { name: 'CrewAI Example', file: 'prompt-engineering/01-PROMPT-ENGINEERING-example-05-crewai.py' }
                ]
            },
            {
                topic: '🤖 Agent Frameworks',
                chapters: [
                    { name: 'Setup', file: 'agent-frameworks/01-SETUP-WEEK1.md' },
                    { name: 'Day 1 Index', file: 'agent-frameworks/01-WEEK1-DAY1-INDEX.md' },
                    { name: 'Day 2 Summary', file: 'agent-frameworks/WEEK1-DAY2-SUMMARY.md' },
                    { name: 'Framework Comparison', file: 'agent-frameworks/overview/19-COMPLETE-FRAMEWORK-COMPARISON.md' },
                    { name: 'Common Mistakes', file: 'agent-frameworks/overview/04-WHAT-WAS-WRONG-AND-FIXED.md' },
                    { name: 'Raw SDK', file: 'agent-frameworks/frameworks/raw-sdk/04-RAW-SDK-MODERN.html' },
                    { name: 'LangChain', file: 'agent-frameworks/frameworks/langchain/05-LANGCHAIN-MODERN.html' },
                    { name: 'LangGraph', file: 'agent-frameworks/frameworks/langgraph/06-LANGGRAPH-MODERN.html' },
                    { name: 'AutoGen', file: 'agent-frameworks/frameworks/autogen/07-AUTOGEN-MODERN.html' },
                    { name: 'CrewAI', file: 'agent-frameworks/frameworks/crewai/08-CREWAI-MODERN.html' },
                    { name: 'Semantic Kernel', file: 'agent-frameworks/frameworks/semantic-kernel/10-SEMANTIC-KERNEL-MODERN.html' },
                    { name: 'Haystack', file: 'agent-frameworks/frameworks/haystack/11-HAYSTACK-MODERN.html' },
                    { name: 'DSPy', file: 'agent-frameworks/frameworks/dspy/12-DSPY-MODERN.html' },
                    { name: 'PhiData', file: 'agent-frameworks/frameworks/phidata/13-PHIDATA-MODERN.html' },
                    { name: 'Vercel AI', file: 'agent-frameworks/frameworks/vercel-ai/14-VERCEL-AI-MODERN.html' }
                ]
            },
            {
                topic: '🧠 Context Engineering',
                chapters: [
                    { name: 'Fundamentals', file: 'context-engineering/24-CONTEXT-ENGINEERING-101.md' },
                    { name: 'Setup', file: 'context-engineering/25-SETUP-WEEK2.md' },
                    { name: 'Exercises', file: 'context-engineering/26-CONTEXT-ENGINEERING-EXERCISES.md' },
                    { name: 'Framework Summary', file: 'context-engineering/29-36-FRAMEWORK-CONTEXT-SUMMARY.md' },
                    { name: 'Advanced Patterns', file: 'context-engineering/39-ADVANCED-CONTEXT-PATTERNS.md' },
                    { name: 'Raw SDK Impl', file: 'context-engineering/implementations/27-RAW-SDK-CONTEXT.py' },
                    { name: 'LangChain Impl', file: 'context-engineering/implementations/28-LANGCHAIN-CONTEXT.py' }
                ]
            },
            {
                topic: '🌍 Real-World Applications',
                chapters: [
                    { name: 'Overview', file: 'real-world-applications/57-WEEK3-OVERVIEW.md' },
                    { name: 'V1 Simple MVP', file: 'real-world-applications/v1-simple-mvp/58-V1-SIMPLE-MVP.py' },
                    { name: 'V2 Multi-Turn', file: 'real-world-applications/v2-multi-turn/59-V2-MULTI-TURN.py' },
                    { name: 'V2 Guide', file: 'real-world-applications/v2-multi-turn/64-V2-DETAILED-GUIDE.md' },
                    { name: 'V3 Tool Agent', file: 'real-world-applications/v3-tool-agent/60-V3-TOOL-AGENT.py' },
                    { name: 'V3 Guide', file: 'real-world-applications/v3-tool-agent/65-V3-DETAILED-GUIDE.md' },
                    { name: 'V4 Multi-Agent', file: 'real-world-applications/v4-multi-agent/61-V4-MULTI-AGENT.py' },
                    { name: 'V4 Guide', file: 'real-world-applications/v4-multi-agent/66-V4-DETAILED-GUIDE.md' },
                    { name: 'V5 Production', file: 'real-world-applications/v5-production/62-V5-PRODUCTION.py' },
                    { name: 'V5 Guide', file: 'real-world-applications/v5-production/67-V5-DETAILED-GUIDE.md' }
                ]
            },
            {
                topic: '⚙️ Production Patterns',
                chapters: [
                    { name: 'Planning', file: 'production-patterns/WEEK4-PLANNING.md' }
                ]
            },
            {
                topic: '📚 Reference',
                chapters: [
                    { name: 'Technology Stack', file: 'reference/TECHNOLOGY-STACK.md' },
                    { name: 'CCA-F Mapping', file: 'reference/CCA-F-CERTIFICATION-MAPPING.md' },
                    { name: 'Learning Path', file: 'reference/LEARNING-PATH-16WEEKS.md' },
                    { name: 'Bootcamp Roadmap', file: 'reference/22-COMPLETE-BOOTCAMP-ROADMAP.md' }
                ]
            },
            {
                topic: '📖 Documentation',
                chapters: [
                    { name: 'GitHub Ready', file: 'docs/BOOTCAMP-READY-FOR-GITHUB.md' },
                    { name: 'GitHub Pages Deploy', file: 'docs/GITHUB-PAGES-DEPLOYMENT.md' },
                    { name: 'File Manifest', file: 'docs/ALL-FILES-MANIFEST.md' }
                ]
            }
        ];

        // Build sidebar
        function buildSidebar() {
            const sidebar = document.getElementById('sidebar-content');
            
            chapters.forEach((section, topicIndex) => {
                const topicDiv = document.createElement('div');
                topicDiv.className = 'topic';
                
                const topicBtn = document.createElement('button');
                topicBtn.className = 'topic-toggle collapsed';
                topicBtn.textContent = section.topic;
                
                const chaptersDiv = document.createElement('div');
                chaptersDiv.className = 'chapters';
                
                section.chapters.forEach(ch => {
                    const link = document.createElement('a');
                    link.className = 'chapter-link';
                    link.href = '#';
                    link.textContent = ch.name;
                    
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        loadChapter(ch.name, ch.file, section.topic);
                        
                        // Update active state
                        document.querySelectorAll('.chapter-link').forEach(l => l.classList.remove('active'));
                        link.classList.add('active');
                    });
                    
                    chaptersDiv.appendChild(link);
                });
                
                topicBtn.addEventListener('click', () => {
                    topicBtn.classList.toggle('collapsed');
                    chaptersDiv.classList.toggle('active');
                    topicBtn.classList.toggle('active');
                });
                
                topicDiv.appendChild(topicBtn);
                topicDiv.appendChild(chaptersDiv);
                sidebar.appendChild(topicDiv);
            });
        }

        // Load chapter content
        async function loadChapter(name, file, topic) {
            const title = document.getElementById('page-title');
            const breadcrumb = document.getElementById('breadcrumb');
            const content = document.getElementById('content-area');
            
            title.textContent = name;
            breadcrumb.textContent = `${topic} / ${name}`;
            content.innerHTML = '<p style="color: #999; text-align: center; padding: 40px;">Loading...</p>';
            
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error('Not found');
                
                const text = await response.text();
                
                if (file.endsWith('.md')) {
                    content.innerHTML = markdownToHtml(text);
                } else if (file.endsWith('.py')) {
                    content.innerHTML = `<pre><code>${escapeHtml(text)}</code></pre>`;
                } else if (file.endsWith('.html')) {
                    content.innerHTML = text;
                } else {
                    content.innerHTML = `<pre><code>${escapeHtml(text)}</code></pre>`;
                }
            } catch (e) {
                content.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <p>📄 ${name}</p>
                        <p style="margin-top: 20px;">File: ${file}</p>
                        <p style="margin-top: 15px; font-size: 12px;">Extract the ZIP to view content</p>
                    </div>
                `;
            }
        }

        // Markdown to HTML
        function markdownToHtml(md) {
            let html = md;
            
            // Headers
            html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
            
            // Code blocks
            html = html.replace(/```([^`]+)```/gs, (match, code) => `<pre><code>${escapeHtml(code.trim())}</code></pre>`);
            
            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Bold & italic
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/_(.*?)_/g, '<em>$1</em>');
            
            // Links
            html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
            
            // Lists
            html = html.replace(/^\* (.*?)$/gm, '<li>$1</li>');
            html = html.replace(/^\- (.*?)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*?<\/li>)/s, '<ul>$1</ul>');
            
            // Blockquotes
            html = html.replace(/^\> (.*?)$/gm, '<blockquote>$1</blockquote>');
            
            // Paragraphs
            html = html.split('\n\n').map(p => {
                if (p.match(/^<(h|ul|ol|pre|blockquote)/)) return p;
                return `<p>${p}</p>`;
            }).join('\n');
            
            return html;
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', buildSidebar);
    </script>
</body>
</html>
